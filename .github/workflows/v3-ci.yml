name: ProctorGuard V3 CI
on:
  push:
    branches: ["feature/proctorguard-v3"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proctorguard-v3-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check backend syntax
        run: node --check server.js
      - name: Run security and contract tests
        run: npm test
      - name: Check V3 browser script syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('v3.html', 'utf8');
          const match = html.match(/<script>([\\s\\S]*?)<\\/script>/);
          if (!match) throw new Error('Inline V3 script not found');
          new Function(match[1]);
          console.log('V3 browser script syntax OK');
          NODE
